name: Build LungScope Desktop v0.10.0

on:
  workflow_dispatch:
  push:
    branches: ["lungscope-desktop-v010"]
    paths:
      - "desktop-ci-v010/**"
      - ".github/workflows/lungscope-desktop-v010.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4

      - name: Reconstruct frozen desktop source
        shell: pwsh
        run: |
          @'
          import base64
          import hashlib
          import pathlib
          import re

          ARCHIVE_SHA256 = '1756e08b415c879cc32009495d3b6a58ff0228f9e097ad4e37d34eaa8dd24ebe'
          LAST_CHUNK_SHA256 = '3e0928030bc916f60624a6f3e06f329fac3e9b920d5bb7ccb58a75f70f3ad071'

          paths = sorted(pathlib.Path('desktop-ci-v010/installer-src').glob('part*.b64'))
          if len(paths) != 4:
              raise SystemExit(f'Expected 4 installer source parts, found {len(paths)}')

          parts = []
          for path in paths:
              raw = path.read_text(encoding='utf-8')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              parts.append(clean)
              print(f'{path.name}: sanitized chars={len(clean)}')

          last = parts[-1]
          last_hash = hashlib.sha256(last.encode('ascii')).hexdigest()
          if last_hash != LAST_CHUNK_SHA256:
              if len(last) != 18413:
                  raise SystemExit(f'Unexpected final chunk length {len(last)}; expected 18412 or recoverable 18413')
              repaired = None
              for i in range(len(last)):
                  candidate = last[:i] + last[i + 1:]
                  if hashlib.sha256(candidate.encode('ascii')).hexdigest() == LAST_CHUNK_SHA256:
                      repaired = candidate
                      print(f'Recovered exact final chunk by removing staged character at index {i}: {last[i]!r}')
                      break
              if repaired is None:
                  raise SystemExit('Could not recover exact final chunk from one-character staging defect')
              parts[-1] = repaired

          joined = ''.join(parts)
          if len(joined) != 72412:
              raise SystemExit(f'Unexpected reconstructed base64 length: {len(joined)}')
          payload = base64.b64decode(joined, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          print(f'Desktop source bytes={len(payload)} sha256={digest}')
          if digest != ARCHIVE_SHA256:
              raise SystemExit(f'Desktop source integrity mismatch: {digest}')
          pathlib.Path('desktop-source.zip').write_bytes(payload)
          print('Frozen desktop source integrity PASS')
          '@ | Set-Content -Encoding UTF8 reconstruct_source.py
          python reconstruct_source.py
          Expand-Archive 'desktop-source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'desktop/src-tauri/tauri.conf.json')) { throw 'Tauri source reconstruction failed.' }

      - name: Reconstruct validated LungScope frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/frontend' | Out-Null
          $chunks = Get-ChildItem 'lungscope/frontend/chunks/part*.txt' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'Validated LungScope frontend chunks are missing.' }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $compressed = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('frontend.gz', $compressed)
          $input = [IO.File]::OpenRead('frontend.gz')
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('desktop/frontend/index.html')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          if ((Get-Item 'desktop/frontend/index.html').Length -lt 100000) { throw 'Frontend reconstruction is unexpectedly small.' }
          python 'desktop-ci-v010/patch_frontend.py'

      - name: Apply Windows desktop release patches
        shell: pwsh
        run: |
          $main = Get-Content 'desktop/src-tauri/src/main.rs' -Raw
          if ($main -notmatch 'windows_subsystem') {
            $main = "#![cfg_attr(not(debug_assertions), windows_subsystem = `"windows`")]`r`n`r`n" + $main
            Set-Content 'desktop/src-tauri/src/main.rs' -Value $main -Encoding UTF8
          }
          $lib = Get-Content 'desktop/src-tauri/src/lib.rs' -Raw
          $lib = $lib.Replace('fn app_data(app: &AppHandle) -> Result<PathBuf, String> {', 'fn app_data(_app: &AppHandle) -> Result<PathBuf, String> {')
          $lib = $lib.Replace('let p = app.path().app_local_data_dir().map_err(|e| e.to_string())?;', 'let p = _app.path().app_local_data_dir().map_err(|e| e.to_string())?;')
          Set-Content 'desktop/src-tauri/src/lib.rs' -Value $lib -Encoding UTF8

      - name: Validate desktop source before compilation
        shell: pwsh
        run: |
          Get-ChildItem 'desktop/engine/app/*.py' | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -c "import json; json.load(open('desktop/src-tauri/tauri.conf.json', encoding='utf-8')); json.load(open('desktop/package.json', encoding='utf-8')); print('desktop JSON/Python validation PASS')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri frontend/build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows NSIS installer
        working-directory: desktop
        env:
          CI: 'true'
        run: npm run tauri build

      - name: List Windows bundle outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'desktop/src-tauri/target/release/bundle') {
            Get-ChildItem 'desktop/src-tauri/target/release/bundle' -Recurse -File | Select-Object FullName,Length
          }

      - name: Upload LungScope installer
        uses: actions/upload-artifact@v4
        with:
          name: LungScope-Desktop-v0.10.0-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/lungscope-desktop.exe
          if-no-files-found: error
          retention-days: 14
